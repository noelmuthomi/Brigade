<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigade Ministry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #09f; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Brigade Ministry</h1>
        <div>
            <button onclick="showPage('home')" class="mr-4 hover:underline">Home</button>
            <button id="nav-login" onclick="showPage('login')" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500">Login</button>
            <button id="nav-logout" onclick="logout()" class="hidden bg-red-600 px-4 py-2 rounded hover:bg-red-500">Logout</button>
        </div>
    </nav>

    <div id="loading" class="hidden fixed inset-0 bg-white bg-opacity-80 flex justify-center items-center z-50">
        <div class="spinner"></div>
    </div>

    <div id="page-home" class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Latest Announcements</h2>
        <div id="announcements-container" class="space-y-4">
            <p class="text-gray-600">Loading announcements...</p>
        </div>
    </div>

    <div id="page-login" class="hidden container mx-auto p-6 max-w-md mt-10">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Portal Login</h2>
            <input type="text" id="username" placeholder="Username" class="w-full mb-4 p-2 border rounded">
            <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-2 border rounded">
            <button onclick="handleLogin()" class="w-full bg-blue-800 text-white p-2 rounded hover:bg-blue-700">Sign In</button>
            <p id="login-error" class="text-red-500 text-sm mt-2 hidden">Invalid credentials.</p>
        </div>
    </div>

    <div id="page-admin" class="hidden container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Admin Portal</h2>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-xl font-bold mb-4">Post Announcement</h3>
            <input type="text" id="ann-title" placeholder="Announcement Title" class="w-full mb-4 p-2 border rounded">
            <textarea id="ann-content" placeholder="Content..." class="w-full mb-4 p-2 border rounded h-32"></textarea>
            <button onclick="postAnnouncement()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-500">Publish</button>
        </div>
    </div>

    <div id="page-teacher" class="hidden container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Officer's Portal</h2>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-xl font-bold mb-4">Mark Attendance</h3>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input type="date" id="att-date" class="p-2 border rounded">
                <select id="att-class" class="p-2 border rounded">
                    <option value="" disabled selected>Select Class Taught...</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="Art & Craft">Art & Craft</option>
                    <option value="Sexuality">Sexuality</option>
                    <option value="Fundamentals">Fundamentals</option>
                </select>
            </div>
            
            <div id="roster-container" class="mb-4">
                <p class="text-sm text-gray-500">Loading roster...</p>
            </div>
            <button onclick="submitAttendance()" class="bg-blue-800 text-white px-6 py-2 rounded hover:bg-blue-700">Submit Register</button>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h3 class="text-xl font-bold mb-4">Enroll New Brigadier</h3>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSco770iozwEJSSOThi1UUuAACVtcU5a7vvdpPH6j6pRpE8prw/viewform?usp=publish-editor" width="100%" height="500" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyGn2qiB0mO2Z4QlJOEfpmFESEL_rZxlvCWL7a-1_iAn2NMxJATL1_jcM9gpP6siux6/exec';
        let currentUser = null;

        // --- UI ROUTING ---
        function showPage(pageId) {
            document.querySelectorAll('div[id^="page-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            if (pageId === 'home') loadAnnouncements();
            if (pageId === 'teacher') loadRoster();
        }

        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // --- API CALLS ---
        async function fetchAPI(action, payload = null) {
            try {
                if (!payload) {
                    const res = await fetch(`${GAS_URL}?action=${action}`);
                    return await res.json();
                } else {
                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' }, // text/plain prevents CORS preflight issues with GAS
                        body: JSON.stringify({ action, ...payload })
                    });
                    return await res.json();
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Network error communicating with the database.");
            }
        }

        // --- AUTHENTICATION ---
        async function handleLogin() {
            toggleLoading(true);
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const response = await fetchAPI('login', { username: user, password: pass });
            toggleLoading(false);

            if (response && response.success) {
                currentUser = response;
                document.getElementById('nav-login').classList.add('hidden');
                document.getElementById('nav-logout').classList.remove('hidden');
                
                if (currentUser.role === 'Admin') showPage('admin');
                if (currentUser.role === 'Teacher') showPage('teacher');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('nav-login').classList.remove('hidden');
            document.getElementById('nav-logout').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showPage('home');
        }

        // --- FEATURES ---
        async function loadAnnouncements() {
            const data = await fetchAPI('getAnnouncements');
            const container = document.getElementById('announcements-container');
            container.innerHTML = '';
            
            if (!data || data.length <= 1) {
                container.innerHTML = '<p>No announcements yet.</p>';
                return;
            }

            // Start from 1 to skip headers, loop backwards for newest first
            for (let i = data.length - 1; i >= 1; i--) {
                const date = new Date(data[i][0]).toLocaleDateString();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded shadow border-l-4 border-blue-800">
                        <h4 class="text-lg font-bold">${data[i][1]}</h4>
                        <p class="text-sm text-gray-500 mb-2">${date} • Posted by ${data[i][3]}</p>
                        <p>${data[i][2]}</p>
                    </div>
                `;
            }
        }

        async function postAnnouncement() {
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;
            if (!title || !content) return alert('Please fill in all fields.');

            toggleLoading(true);
            await fetchAPI('postAnnouncement', { title, content, author: currentUser.name });
            toggleLoading(false);
            
            document.getElementById('ann-title').value = '';
            document.getElementById('ann-content').value = '';
            alert('Announcement Published!');
        }

        async function loadRoster() {
            const data = await fetchAPI('getBrigadiers');
            const container = document.getElementById('roster-container');
            if (!data || data.length <= 1) {
                container.innerHTML = '<p>No learners enrolled yet.</p>';
                return;
            }

            let html = '<table class="w-full text-left border-collapse"><thead><tr><th class="border-b p-2">Brigadier</th><th class="border-b p-2">Status</th></tr></thead><tbody>';
            // Assuming Brigadier Name is in column index 1 (2nd column)
            for (let i = 1; i < data.length; i++) {
                const name = data[i][1];
                html += `
                    <tr>
                        <td class="border-b p-2">${name}</td>
                        <td class="border-b p-2">
                            <select data-name="${name}" class="attendance-select p-1 border rounded">
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                                <option value="Excused">Excused</option>
                            </select>
                        </td>
                    </tr>
                `;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function submitAttendance() {
            const date = document.getElementById('att-date').value;
            const classTaught = document.getElementById('att-class').value;
            
            if (!date || !classTaught) return alert('Please select a date and class taught.');

            const selects = document.querySelectorAll('.attendance-select');
            const records = Array.from(selects).map(select => ({
                name: select.getAttribute('data-name'),
                status: select.value
            }));

            toggleLoading(true);
            const response = await fetchAPI('submitAttendance', {
                teacher: currentUser.name,
                date: date,
                classTaught: classTaught,
                records: records
            });
            toggleLoading(false);

            if (response && response.success) {
                alert('Attendance successfully recorded!');
                document.getElementById('att-date').value = '';
                document.getElementById('att-class').value = '';
            }
        }

        // Initialize App
        window.onload = () => showPage('home');
    </script>
</body>
</html>
